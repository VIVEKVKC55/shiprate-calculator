<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compare estimated courier rates for your shipment.">
  <title>{% block title %}ShipRate Calculator{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}<link href="{% static 'calculator/css/style.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container"><a class="navbar-brand fw-bold" href="{% url 'calculator:home' %}"><span class="brand-mark">S</span> ShipRate</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav ms-auto"><a class="nav-link" href="{% url 'calculator:home' %}">Calculator</a><a class="nav-link" href="{% url 'calculator:about' %}">About</a></div></div>
    </div>
  </nav>
  <main class="container page-shell">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><div class="container d-flex flex-column flex-md-row justify-content-between gap-2"><span>© {% now "Y" %} ShipRate Calculator</span><span>Rates are estimates. Final charges may vary by shipment and account conditions.</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
