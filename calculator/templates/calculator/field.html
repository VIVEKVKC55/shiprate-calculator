<label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark">*</span>{% endif %}</label>
<div class="input-wrap">{% if icon %}<span class="input-icon">{{ icon }}</span>{% endif %}{{ field.as_widget|safe }}</div>
{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
